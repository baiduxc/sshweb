<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSHWEB · 我的农场</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录：Minecraft 标题屏风格 -->
<div id="login" class="login-wrap hidden">
  <div class="mc-title">
    <h1>SSH<span>WEB</span></h1>
    <div class="mc-subtitle">我的农场 · 服务器牧场版</div>
  </div>
  <div class="mc-menu">
    <div class="mc-field">
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="管理密码">
      <button class="mc-eye" id="loginEye" type="button" title="显示/隐藏密码">👁</button>
    </div>
    <div id="loginErr" class="mc-err hidden"></div>
    <button id="loginBtn" class="mc-btn big">🔑 管理登录</button>
    <button id="guestBtn" class="mc-btn big">🐔 游客模式进入农场</button>
    <a class="mc-btn" href="https://github.com/baiduxc/sshweb" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
  </div>
  <div class="mc-foot">每只鸡都是一台服务器 · 游客可追鸡互殴 · 管理登录后才能打开终端</div>
</div>

<!-- 农场（3D） -->
<div id="app" class="app hidden">
  <div id="farmHost"></div>
  <div id="labels"></div>
  <div id="fPrompt" class="f-prompt hidden">按 F 交互</div>

  <!-- 左上角统计（唯一面板） -->
  <div class="stats-panel" id="statsPanel">
    <div id="statProbes">📡 探针鸡在线 0/0</div>
    <div id="statServers">🐔 网站鸡在线 0/0</div>
    <div id="statAngry">💢 暴躁鸡 0 只</div>
  </div>

  <!-- 顶部事件播报 -->
  <div id="eventTicker" class="event-ticker hidden"></div>

  <!-- 死亡覆盖层 -->
  <div id="deathOverlay" class="death-overlay hidden">
    <div class="death-box">
      <h2>💀 你被啄倒了！</h2>
      <p id="deathBy"></p>
      <button class="mc-btn big" id="respawnBtn">🐣 随机复活</button>
    </div>
  </div>

  <!-- 触屏摇杆 -->
  <div id="joystick" class="joystick hidden"><div class="stick"></div></div>

  <!-- 指针锁定提示 -->
  <div id="lockHint" class="lock-hint">点击画面锁定鼠标 · ESC 释放</div>

  <div class="hud-top">
    <div class="hud-actions">
      <a class="mc-btn sm" href="https://github.com/baiduxc/sshweb" target="_blank" rel="noopener noreferrer" title="GitHub 仓库">GitHub</a>
      <button class="mc-btn sm" id="joinBtn" title="任何人都可以部署公开探针">📡 加入</button>
      <button class="mc-btn sm" id="renameBtn" title="修改我的昵称">✏️ 改名</button>
      <button class="mc-btn sm" id="adminBtn" title="管理面板 (E)">☰ 管理 (E)</button>
      <button class="mc-btn sm" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="hud-hint" id="hudHint">点击画面锁定鼠标 · WASD 移动 · 空格跳/双击空格飞行 · 滚轮缩放视野 · ← → 翻页 · 建材对准方块=贴面放置 · 镐子挖掘 · TNT 会爆炸 · Q 循环 · F 交互/锁鸡</div>

  <div class="hotbar-wrap">
    <div class="hotbar" id="hotbar"></div>
    <div class="hotbar-pager" id="hotbarPager"></div>
  </div>
</div>

<!-- 终端覆盖层 -->
<div id="terminal" class="terminal-wrap hidden">
  <div class="term-win">
    <div class="term-bar">
      <span class="status-dot" id="termDot"></span>
      <b id="termName">—</b><small id="termAddr"></small>
      <div class="term-tools">
        <select id="quickCmd" title="常用命令"></select>
        <button class="mc-btn sm" id="termPaste" title="粘贴">粘贴</button>
        <button class="mc-btn sm" id="termCopy" title="复制选中">复制</button>
        <button class="mc-btn sm" id="termClear" title="清屏">清屏</button>
        <button class="mc-btn sm" id="termReconnect" title="重连">重连</button>
        <button class="mc-btn sm danger" id="termClose" title="关闭 (Esc)">✕ 关闭</button>
      </div>
    </div>
    <div class="term-host" id="termHost"></div>
  </div>
</div>

<!-- 弹层：管理面板 / 表单 / 确认框 -->
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/fit.js"></script>
<script src="vendor/search.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
